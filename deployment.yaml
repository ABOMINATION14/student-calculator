apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-calculator-deployment
  labels:
    app: student-calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-calculator
  template:
    metadata:
      labels:
        app: student-calculator
    spec:
      containers:
      - name: student-calculator-container
        image: abomination14/student-calculator:84e4a23
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
