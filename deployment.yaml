apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-calculator-deployment
  labels:
    app: student-calculator
Spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-calculator
  template:
    metadata:
      labels:
        app: student-calculator
    spec:
      containers:
      - name: student-calculator-container
        # Replace 'your_dockerhub_username' with your actual Docker Hub space name
        image: your_dockerhub_username/student-calculator:IMAGE_TAG_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
